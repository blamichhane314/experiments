  title("Experiment 3");
  const D = await loadX3();
  const f = {m: params.get("m") || "", fo: params.get("fo") || "", c: params.get("c") || "", va: params.get("va") || "main"};
  v.innerHTML = `<div class="wrap viewhead">
      <h1 class="title">Ratings and relations over repeated rounds</h1>
      <p class="lead">Claude Haiku 4.5 and Claude Sonnet 5.5 were given 80 statements on immigration enforcement in the United States (40 statements and their negations). Each round consisted of a rating prompt (agreement from −10 to +10 for every statement) and a relation prompt (related pairs with a signed strength). In setting A, a single model started from its ratings and relations after six news articles, and in each of five rounds one new item bearing on a focal statement was added to the prompt. In setting B, eight instances of a model, each first given a different set of articles, received their network neighbours’ ratings from the previous round, over eight rounds. In total, ${D.chains.length} chains and ${D.pops.length} populations.</p>
    </div>
    <div class="wrap">
      <section class="sec"><h2>One model over five rounds</h2>

        <div class="thumbs" id="xthumbs"></div>
        ${calKey("fit", "rating", "", true)}
      </section>
      <section class="sec"><h2>Eight models on a social network</h2>
        <p class="lead">Each population consists of eight instances of one model. In round 0, agents 1 to 3 were given left-leaning articles (solid ring), 4 to 6 right-leaning articles (dashed), and 7 and 8 a balanced set (dotted). Selecting a population opens every agent’s network, round by round.</p>
        <div class="popcs">${D.pops.map(p => `<a class="popc" href="#/x3/b/${enc(p.key)}">${x3SocialSVG(p, 0, 96)}<span class="tc">Claude ${esc(p.model)}<br>${esc(X3_TOPO[p.topo])} · population ${p.pop}</span></a>`).join("")}</div>

  function draw(){

      <div class="lab">Focal statement</div><div class="mtabs">${chipB("fo", "", "All")}${Object.keys(X3_FOCAL).map(k => chipB("fo", k, X3_FOCAL[k] + (k!=="none" ? " (" + D.focal[k].id + ")" : ""))).join("")}</div>
      <div class="lab">What arrived</div><div class="mtabs">${chipB("c", "", "All")}${Object.keys(X3_COND).map(k => chipB("c", k, X3_COND[k])).join("")}</div>

      <div></div><div class="faint" style="font-size:13px">${["held", "installed"].filter(k => !f.fo || f.fo===k).map(k => `${esc(D.focal[k].id)}: “${esc(D.focal[k].text)}”`).join("<br>")}</div>`;

      setAddr("/x3", p); draw();
    }));
    const cs = D.chains.filter(c => (!f.m || c.model===f.m) && (!f.fo || c.focal===f.fo) && (!f.c || c.cond===f.c) && c.variant===f.va);
    $("#xthumbs", v).innerHTML = cs.map(c => { const r = c.rounds[c.rounds.length - 1];

function x3Rows(D, s, prev, extra){
  return D.statements.map(([id, text], i) => {
    const v0 = s[i], b = prev ? prev[i] : undefined, chg = prev && b!==v0 ? "previously " + signed(b) : "";
    return `<div class="prow${chg ? " ch" : ""}" data-id="${esc(id)}"><span class="id">${esc(id)}</span><span class="tx">${esc(text)}</span><span class="att ${attCls(v0)}">${esc(signed(v0))}</span>${chg || extra ? `<span class="chg">${esc(chg)}${extra ? extra(i) : ""}</span>` : ""}</div>`;
  }).join("");
}

function x3Wire(v, D, s, e, onPick, mark){
  const cap = $(".netbox .cap", v), L = x3links(D, e);
  let focus = null;
  const gf = gfDraw($(".netbox .gf", v), gfOf({props: x3props(D, s), links: L}, true, false, mark), {key: "x3", onFocus: id => pick(id, true, true)});
  const pick = (id, scroll, fromGraph) => {
    focus = fromGraph ? id : focus===id ? null : id;
    PAGEFOCUS.set("x3", focus);
    $$(".prow", v).forEach(x => x.classList.toggle("on", x.dataset.id===focus));
    if(!fromGraph) gf.focus(focus);
    if(onPick) onPick(focus);
    if(!focus){ cap.innerHTML = ""; return; }
    const i = D.ids.indexOf(focus), ls = L.filter(l => l[0]===focus || l[1]===focus).map(l => `${l[2] > 0 ? "fits" : "clashes with"} ${l[0]===focus ? l[1] : l[0]} (${l[2] > 0 ? "+" : "−"}${Math.abs(l[2])})`);
    cap.innerHTML = `<span class="id">${esc(focus)}</span> <span class="att ${attCls(s[i])}">${esc(signed(s[i]))}</span> ${esc(D.statements[i][1])}<span class="ls">${ls.length ? esc(ls.join("; ")) : "no related pairs"}</span>`;
    const row = $(`.prow[data-id="${CSS.escape(focus)}"]`, v);
    if(row && scroll) row.scrollIntoView({block: "nearest", behavior: "smooth"});
  };
  $$(".prow", v).forEach(x => x.addEventListener("click", () => pick(x.dataset.id, false)));
  const kept = PAGEFOCUS.get("x3");                   // the statement chosen before the round, agent or chain changed stays chosen
  if(kept && D.ids.includes(kept)) pick(kept, false);
  return pick;
}

async function openX3Chain(v, key, params){
  const D = await loadX3(), c = D.chains.find(x => x.key===key);
  if(!c) return openX3(v, new URLSearchParams());
  const st = {r: Math.min(c.rounds.length - 1, Math.max(0, +(params.get("r") ?? 0)))};
  const F = c.focal==="none" ? null : D.focal[c.focal], fset = x3focal(D, c);
  title(`${c.model}, ${X3_COND[c.cond]}, repetition ${c.rep} · Experiment 3`);
  const sib = o => D.chains.find(x => ["model", "focal", "cond", "variant", "rep"].every(k => x[k]===(o[k] ?? c[k])));
  const chip = (txt, o, on) => { const x = sib(o); return x ? `<a class="chip${on ? " on" : ""}" href="#/x3/a/${enc(x.key)}?r=${st.r}">${esc(txt)}</a>` : ""; };
  function draw(){
    const R = c.rounds[st.r], prev = st.r > 0 ? c.rounds[st.r - 1].s : null;
    const fi = F ? D.ids.indexOf(F.id) : -1, ni = F && F.neg ? D.ids.indexOf(F.neg) : -1;
    const traj = F ? `<div class="traj"><span class="lab">Rating of ${esc(F.id)} by round</span>${c.rounds.map((x, k) => `<span class="${k===st.r ? "on " : ""}${attCls(x.s[fi])}">${esc(signed(x.s[fi]))}</span>`).join("")}${ni >= 0 ? `<span class="lab">and of its negation ${esc(F.neg)}</span>${c.rounds.map((x, k) => `<span class="${k===st.r ? "on " : ""}${attCls(x.s[ni])}">${esc(signed(x.s[ni]))}</span>`).join("")}` : ""}</div>` : "";
    v.innerHTML = `<div class="wrap viewhead">
        <h1 class="title">${esc(F ? "“" + F.text + "”" : "No focal statement, nothing arriving")}</h1>
        <p class="lead">${F ? `The focal statement, ${esc(F.id)}. ` : ""}Claude ${esc(c.model)}${c.variant!=="main" ? ` (${esc(X3_VAR[c.variant].toLowerCase())})` : ""} started from its ratings and relations after six news articles. In each of the following five rounds the prompt added: ${esc(X3_COND[c.cond].toLowerCase())}. Repetition ${c.rep} of 3.</p>
        ${traj}
        <div class="pick">
          <div class="lab">Model</div><div class="mtabs">${["Haiku 4.5", "Sonnet 5.5"].map(m => chip(m, {model: m}, m===c.model)).join("")}</div>
          <div class="lab">Focal statement</div><div class="mtabs">${Object.keys(X3_FOCAL).map(k => chip(X3_FOCAL[k], k==="none" ? {focal: k, cond: "nothing"} : {focal: k, cond: c.cond==="nothing" ? "opposite" : c.cond}, k===c.focal)).join("")}</div>
          <div class="lab">What arrived</div><div class="mtabs">${Object.keys(X3_COND).map(k => chip(X3_COND[k], k==="nothing" ? {cond: k, focal: "none"} : {cond: k, focal: c.focal==="none" ? "held" : c.focal}, k===c.cond)).join("")}</div>
          <div class="lab">Settings</div><div class="mtabs">${Object.keys(X3_VAR).map(k => chip(X3_VAR[k], {variant: k, model: k==="temp03" ? "Haiku 4.5" : k==="think" ? "Sonnet 5.5" : c.model}, k===c.variant)).join("")}</div>
          <div class="lab">Repetition</div><div class="mtabs">${[1, 2, 3].map(k => chip(String(k), {rep: k}, k===c.rep)).join("")}</div>
        </div>
      </div>
      <div class="wrap" style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:18px">
        <div class="stepbar" role="group" aria-label="Round">${c.rounds.map((_, k) => `<button data-r="${k}" aria-pressed="${k===st.r}">Round ${k}</button>`).join("")}</div>
        <p class="artline">${x3Arrival(D, c, st.r)}</p>
        <div class="runbody"><div class="netbox">${gfHost("The ratings and related pairs of this round")}<div class="cap" aria-live="polite"></div>${calKey("fit", "rating", "")}</div>
          <div class="plist"><div class="cnt">${plural(R.s.filter(x => x!=null).length, "rating")} given, ${R.s.filter(x => x==null).length} null · ${plural(R.e.length, "related pair")}${prev ? ` · ${plural(R.s.filter((x, i) => x!==prev[i]).length, "rating")} changed since round ${st.r - 1}` : ""}</div>${x3Rows(D, R.s, prev)}</div></div>
        <section class="sec" style="margin-top:8px"><details class="grp"><summary><b>Terms</b> · statement, rating, related pair, focal statement, round</summary><div style="padding:4px 0 16px">${x3Terms()}</div></details>${x3Method(D)}</section>
      </div>`;
    x3Wire(v, D, R.s, R.e, null, fset);
    $$(".stepbar button", v).forEach(b => b.addEventListener("click", () => { st.r = +b.dataset.r; setAddr(`/x3/a/${enc(c.key)}`, new URLSearchParams({r: st.r})); keepPlace(draw); }));
  }
  draw();
}

async function openX3Pop(v, key, params){
  const D = await loadX3(), p = D.pops.find(x => x.key===key);
  if(!p) return openX3(v, new URLSearchParams());
  const st = {r: Math.min(p.rounds.length - 1, Math.max(0, +(params.get("r") ?? 0))), a: Math.min(8, Math.max(1, +(params.get("a") || 1))), sid: null};

  }

    const R = p.rounds[st.r], A = R[st.a - 1], prev = st.r > 0 ? p.rounds[st.r - 1][st.a - 1].s : null;
    const nbs = p.graph.flatMap(([i, j]) => i===st.a - 1 ? [j + 1] : j===st.a - 1 ? [i + 1] : []).sort((a, b) => a - b);
    v.innerHTML = `<div class="wrap viewhead">

        <div class="pick"><div class="lab">Population</div><div class="mtabs">${D.pops.map(x => `<a class="chip${x.key===p.key ? " on" : ""}" href="#/x3/b/${enc(x.key)}?r=${st.r}&a=${st.a}">${esc(x.model)}, ${esc(X3_TOPO[x.topo].toLowerCase())}, ${x.pop}</a>`).join("")}</div></div>
      </div>
      <div class="wrap" style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:18px">
        <div class="stepbar" role="group" aria-label="Round">${p.rounds.map((_, k) => `<button data-r="${k}" aria-pressed="${k===st.r}">Round ${k}</button>`).join("")}</div>
        <div class="agents">${R.map((ag, k) => `<button class="agent${k + 1===st.a ? " on" : ""}" data-a="${k + 1}">${netSVG({props: x3props(D, ag.s), links: x3links(D, ag.e)}, true, new Set(), true)}<span class="tc">Agent ${k + 1}</span><span class="tn">${esc(X3_SET[ag.set])}</span></button>`).join("")}</div>
        <div class="agbar">${x3SocialSVG(p, st.a, 120)}<p class="artline" style="margin:0">Agent <b>${st.a}</b>: ${esc(X3_SET[A.set])} in round 0. ${st.r===0 ? "Round 0: ratings and relations returned with the articles in the prompt." : `Round ${st.r}: the prompt contained the ratings of agent${nbs.length > 1 ? "s" : ""} ${nbs.length > 1 ? nbs.slice(0, -1).join(", ") + " and " + nbs[nbs.length - 1] : nbs[0]} from round ${st.r - 1}.`}</p></div>
        <div class="runbody"><div class="netbox">${gfHost("This agent's ratings and related pairs in this round")}<div class="cap" aria-live="polite"></div><div class="tc2"></div>${calKey("fit", "rating", "")}</div>
          <div class="plist"><div class="cnt">Agent ${st.a}, round ${st.r}: ${plural(A.s.filter(x => x!=null).length, "rating")} given · ${plural(A.e.length, "related pair")}.</div><p class="x3key">Under each statement, the line runs from −10 (completely disagree) at the left to +10 (completely agree) at the right; the tick marks 0. Each dot is one agent’s rating in this round: filled for agreement, hollow for disagreement. “null” counts the agents that gave no rating, as the prompt allowed: “If you cannot form a view on a statement, give null for it.” The number at the right is agent ${st.a}’s own rating; “·” means it gave null.</p>${x3Rows(D, A.s, prev, i => strip(R.map(ag => ag.s[i])))}</div></div>
        <section class="sec" style="margin-top:8px"><details class="grp"><summary><b>Terms</b> · statement, rating, related pair, round</summary><div style="padding:4px 0 16px">${x3Terms()}</div></details>${x3Method(D)}</section>
      </div>`;
    const tc = $(".tc2", v);
    x3Wire(v, D, A.s, A.e, id => { st.sid = id; tc.innerHTML = id ? `<div class="tcl">Ratings of ${esc(id)} by all eight agents, rounds 0 to ${p.rounds.length - 1} (agent ${st.a} in ink)</div>${chart(D.ids.indexOf(id))}` : ""; });
    $$(".stepbar button", v).forEach(b => b.addEventListener("click", () => { st.r = +b.dataset.r; addr(); keepPlace(draw); }));
    $$(".agent", v).forEach(b => b.addEventListener("click", () => { st.a = +b.dataset.a; addr(); keepPlace(draw); }));
    $$(".agbar .ag", v).forEach(g => g.addEventListener("click", () => { st.a = +g.dataset.a; addr(); keepPlace(draw); }));
  }

}

const refAuthors = a => andList(a.map(([f, g]) => `${f}, ${ini(g)}`));
function refVenue(r){
  const pp = r.pages ? ` (pp. ${esc(r.pages)})` : "";
  if(r.type==="journal") return `<i>${esc(r.container)}</i>${r.volume ? `, <i>${esc(r.volume)}</i>` : ""}${r.issue ? `(${esc(r.issue)})` : ""}${r.pages ? `, ${esc(r.pages)}` : r.article ? `, Article ${esc(r.article)}` : ""}.`;
  if(r.type==="conference") return `In <i>${esc(r.container)}</i>${r.series ? ` (${esc(r.series)}, Vol. ${esc(r.volume)})` : ""}${pp}.${r.publisher ? ` ${esc(r.publisher)}.` : ""}`;
  if(r.type==="chapter") return `In ${esc(andList(r.editors.map(([f, g]) => `${ini(g)} ${f}`)))} (Eds.), <i>${esc(r.container)}</i>${pp}. ${esc(r.publisher)}.`;
  if(r.type==="thesis") return `Doctoral dissertation, ${esc(r.institution)}.${r.publisher ? ` ${esc(r.publisher)}.` : ""}`;
  return `Preprint, arXiv:${esc(r.arxiv)}.`;
}
function refItem(k, r){
  const pub = r.type==="preprint" ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">arXiv ↗</a>` : `<a href="${esc(r.url)}" target="_blank" rel="noopener">Published version ↗</a>`;
  const arx = r.arxiv && r.type!=="preprint" ? `<a href="https://arxiv.org/abs/${esc(r.arxiv)}" target="_blank" rel="noopener">arXiv ↗</a>` : "";
  const doi = r.doi ? `<span class="doi">doi:${esc(r.doi)}</span>` : "";
  return `<li class="ref" id="ref-${esc(k)}"><span class="yr">${esc(r.year)}</span><div>
    <div class="au">${esc(refAuthors(r.authors))}</div>
    <div class="ti">${r.type==="thesis" ? `<i>${esc(r.title)}</i>` : esc(r.title)}</div>
    <div class="ve">${refVenue(r)}</div>
    <div class="lk">${NOTES[k] ? `<button class="notes-btn" data-k="${esc(k)}" aria-haspopup="dialog"><i></i>Notes <b>${NOTES[k].marks}</b></button>` : ""}${r.type!=="journal" ? `<span class="tag">${esc(r.venue)}</span>` : ""}${pub}${arx}${doi}</div></div></li>`;
}
async function openLit(v){
  title("Related literature");
  if(!LIT){ LIT = await getJSON(SITE.files.lit); NOTES = await getJSON(SITE.files.notes).catch(() => ({})); }
  const n = Object.keys(LIT.refs).length;
  const count = g => g.sub.reduce((a, s) => a + s.refs.length, 0);
  v.innerHTML = `<div class="wrap viewhead">
      <h1 class="title">Related literature</h1>
      <p class="lead">${n} works, grouped by subject. Each entry links to the published version and, where one exists, to the arXiv version.</p>
      <div class="litnav">${LIT.groups.map(g => `<button class="chip" data-g="${esc(g.id)}">${esc(g.name)} <span class="faint">${count(g)}</span></button>`).join("")}</div>
    </div>
    <div class="wrap lit">${LIT.groups.map(g => `<section aria-labelledby="lg-${esc(g.id)}"><h2 class="grp-h" id="lg-${esc(g.id)}">${esc(g.name)}<span class="cnt">${count(g)}</span></h2>
      ${g.sub.map(s => `${s.name ? `<h3 class="sub-h">${esc(s.name)}</h3>` : ""}<ol class="refs">${s.refs.map(k => refItem(k, LIT.refs[k])).join("")}</ol>`).join("")}</section>`).join("")}</div>`;
  v.querySelectorAll(".litnav .chip").forEach(b => b.addEventListener("click", () => document.getElementById("lg-" + b.dataset.g).scrollIntoView({behavior: "smooth", block: "start"})));
  v.querySelectorAll(".notes-btn").forEach(b => b.addEventListener("click", () => openNotes(b.dataset.k, b)));
}
/* the parts of a passage as stored, with the paper's own spacing (none where a mark begins or ends inside a word) */
const joinParts = parts => parts.map(([s, m]) => m ? `<mark>${esc(s)}</mark>` : esc(s.replace(/\s{2,}/g, " "))).join("");
function openNotes(k, from){
  const r = LIT.refs[k], N = NOTES[k], L = N.passages, nc = L.reduce((a, n) => a + (n.comments || []).length, 0);
  const box = document.createElement("div");
  box.className = "nv";
  box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-labelledby", "nv-t");
  box.innerHTML = `<div class="nv-back"></div><article class="nv-panel" tabindex="-1">
    <header class="nv-head"><div class="au">${esc(refAuthors(r.authors))} (${esc(r.year)}) · ${esc(r.venue)}</div>
      <h2 id="nv-t">${esc(r.title)}</h2>
      <div class="sub"><i></i>${plural(N.marks, "mark")}${L.length !== N.marks ? ` in ${plural(L.length, "passage")}` : ""}${nc ? `, ${plural(nc, "comment")}` : ""}, in page order. Page numbers are the PDF's.</div>
      <button class="nv-x" aria-label="Close the notes">×</button></header>
    <ol class="nv-list">${L.map(n => `<li class="nv-item"><span class="nv-pg">p. ${esc(n.page)}</span><div>
      <p class="nv-p">${joinParts(n.parts)}</p>
      ${(n.comments || []).map(c => `<div class="nv-c"><span>Comment${n.parts.filter(x => x[1]).length > 1 ? ` on “${esc(c.on)}…”` : ""}</span>${esc(c.text)}</div>`).join("")}</div></li>`).join("")}</ol></article>`;
  document.body.appendChild(box);
  document.body.classList.add("nv-open");
  const panel = box.querySelector(".nv-panel");
  panel.focus();
  const close = () => { box.remove(); document.body.classList.remove("nv-open"); document.removeEventListener("keydown", key); if(from) from.focus(); };
  const key = e => { if(e.key === "Escape") close(); };
  document.addEventListener("keydown", key);
  box.querySelector(".nv-back").addEventListener("click", close);
  box.querySelector(".nv-x").addEventListener("click", close);
  window.addEventListener("hashchange", close, {once: true});
}

/* ------------------------------------------------------------------ start */
(async () => {
  try{ SITE = await getJSON("assets/site.json"); LASTKIND = pageKind(); route(); }
  catch(e){ fail(e); }
})();
</script>
